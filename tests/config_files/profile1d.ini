[domain]
# spatial resolution [m]
res: 1
slope_width: 1

[data]
# input profile table
data1d: tests/data/profile1d/data1D.csv
# input soil types table
data1d_soil_types: tests/data/profile1d/data1D_soil_types.csv
# file with the rainfall record
rainfall: tests/data/rainfall_rain_sim.txt

[time]
# maximum and initial time [sec]
maxdt: 30
# end time of simulations [min]
endtime: 60

[output]
# output directory
# content of the directory is erased at the beginning of the program
outdir: tests/data/output

[infiltration]
# Infiltration type
#  - 1 Philip infiltration
#  - 2 Green-Ampt infiltration (experimental)
#  - 3 Richards infiltration (not implemented yet)
#  - 4 Green-Ampt infiltration for unsteady rainfall (experimental)
# default: 1
type: 1
